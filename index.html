<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, orderBy, query }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // Ganti dengan config milik Anda dari langkah 2
  const firebaseConfig = {
    apiKey: "ISI_API_KEY",
    authDomain: "PROJECT_ID.firebaseapp.com",
    projectId: "PROJECT_ID",
    storageBucket: "PROJECT_ID.appspot.com",
    messagingSenderId: "ISI",
    appId: "ISI"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Contoh: kirim data
  window.kirimData = async (nama, nilai) => {
    await addDoc(collection(db, "dashboard"), { nama, nilai, waktu: Date.now() });
  };

  // Contoh: tampilkan data realtime di dashboard
  const q = query(collection(db, "dashboard"), orderBy("waktu", "desc"));
  onSnapshot(q, (snap) => {
    snap.forEach((doc) => console.log(doc.data()));
    // TODO: tampilkan ke tabel/grafik dashboard Anda
  });
</script>
